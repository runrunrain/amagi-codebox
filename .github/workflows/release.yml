name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (for example v1.3.124)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
            webui-claude/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Build mobile
        run: npm run build
        working-directory: mobile

      # webui-claude（Claude Code Web 平面 SPA）：镜像 mobile 步骤构建，
      # 产物落 internal/claudewebui/dist（vite outDir），供 wails build 嵌入。
      # Windows job 的 wails build -s 虽仍会执行 preBuildHooks（聚合脚本
      # build:embedded-web，hook 在 IgnoreFrontend 判定之前运行），此处显式
      # 构建保证日志可见且不依赖 hook 行为。
      - name: Install claude-webui dependencies
        run: npm ci
        working-directory: webui-claude

      - name: Build claude-webui
        run: npm run build
        working-directory: webui-claude

      - name: Get version
        id: get_version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Sync wails.json version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          v = "${{ steps.get_version.outputs.VERSION }}".lstrip("v")
          with open("wails.json", encoding="utf-8") as f:
              d = json.load(f)
          d.setdefault("info", {})["productVersion"] = v
          with open("wails.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("synced wails.json info.productVersion ->", v)
          PY

      - name: Compute build metadata
        id: build_meta
        shell: bash
        run: |
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "go_version=$(go version | awk '{print $3}')" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          wails build -s -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.GitCommit=${{ steps.build_meta.outputs.git_commit }} -X main.BuildTime=${{ steps.build_meta.outputs.build_time }} -X main.GoVersion=${{ steps.build_meta.outputs.go_version }}"

      - name: Create ZIP archive
        run: |
          cd build/bin
          7z a -tzip ../../amagi-codebox-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip amagi-codebox.exe
        shell: cmd

      - name: Extract CHANGELOG release notes
        shell: bash
        run: |
          ver="${RELEASE_TAG#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]($| )" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG 未收录 [${ver}] 章节，回退到仓库 CHANGELOG 链接" >&2
            printf '本次更新内容见 CHANGELOG：https://github.com/%s/blob/master/CHANGELOG.md\n' "$GITHUB_REPOSITORY" > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: amagi-codebox-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip
          body_path: release-notes.md
          generate_release_notes: true

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
            webui-claude/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Build mobile
        run: npm run build
        working-directory: mobile

      # webui-claude（Claude Code Web 平面 SPA）：镜像 mobile 步骤构建，
      # 产物落 internal/claudewebui/dist（vite outDir），供 wails build 嵌入。
      # macOS job 的 wails build 不带 -s，本就会执行 preBuildHooks（聚合脚本
      # build:embedded-web）重建两个 dist；此处显式构建保证日志可见、
      # 失败点独立可读，不依赖 hook 行为。
      - name: Install claude-webui dependencies
        run: npm ci
        working-directory: webui-claude

      - name: Build claude-webui
        run: npm run build
        working-directory: webui-claude

      - name: Get version
        id: get_version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Sync wails.json version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          v = "${{ steps.get_version.outputs.VERSION }}".lstrip("v")
          with open("wails.json", encoding="utf-8") as f:
              d = json.load(f)
          d.setdefault("info", {})["productVersion"] = v
          with open("wails.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("synced wails.json info.productVersion ->", v)
          PY

      - name: Compute build metadata
        id: build_meta
        shell: bash
        run: |
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "go_version=$(go version | awk '{print $3}')" >> $GITHUB_OUTPUT

      - name: Build macOS arm64 bundle
        run: |
          wails build -clean -platform darwin/arm64 -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }} -X main.GitCommit=${{ steps.build_meta.outputs.git_commit }} -X main.BuildTime=${{ steps.build_meta.outputs.build_time }} -X main.GoVersion=${{ steps.build_meta.outputs.go_version }}"

      - name: Ad-hoc sign and verify macOS bundle
        run: |
          codesign --force --deep --sign - build/bin/amagi-codebox.app
          codesign --verify --deep --strict --verbose=2 build/bin/amagi-codebox.app

      - name: Prepare macOS arm64 artifact
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent build/bin/amagi-codebox.app release-assets/amagi-codebox-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.zip

      - name: Codesign placeholder
        if: ${{ false }}
        run: |
          echo "Reserved for Developer ID signing after certificate + entitlements are wired in."

      - name: Notarization placeholder
        if: ${{ false }}
        run: |
          echo "Reserved for notarization after signing credentials are available."

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: release-assets/amagi-codebox-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.zip
