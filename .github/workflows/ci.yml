name: CI

on:
  # Stage pushes intentionally do not consume GitHub Actions. Run CI once,
  # manually, after all development is complete (C-011).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-quality:
    name: Go (${{ matrix.os }})
    needs: frontend-mobile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded web assets
        uses: actions/download-artifact@v4
        with:
          name: embedded-web-assets
          path: .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Go vet
        run: go vet ./...

      # Lint 门禁（Phase 3 S6）：与本地同一 pinned 版本；跑在 matrix 两条腿上，
      # 使 _windows.go/_darwin.go 平台专属文件均被静态检查。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Go test
        if: matrix.os == 'macos-latest'
        run: go test ./... -count=1

      - name: Go test (compile only)
        if: matrix.os == 'windows-latest'
        run: go test ./... -run '^$' -count=1

  frontend-mobile:
    name: Frontend and mobile
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Build mobile
        run: npm run build
        working-directory: mobile

      - name: Test mobile
        run: npm run test
        working-directory: mobile

      - name: Check contrast ratios
        run: node scripts/check-contrast.mjs
        working-directory: mobile

      - name: Upload embedded web assets
        uses: actions/upload-artifact@v4
        with:
          name: embedded-web-assets
          path: |
            frontend/dist
            mobile/dist
          if-no-files-found: error
